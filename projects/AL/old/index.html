<!DOCTYPE html>
<html lang="en">
<head>
  <base href="http://192.168.1.70/AL/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lifeguard training, certification and water-safety resources from the American Lifeguard Association.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A2540">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>American Lifeguard Association</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0A2540; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: linear-gradient(160deg, #0A2540, #155080);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff; z-index: 9999;
    }
    #boot .crest {
      width: 84px; height: 84px; border-radius: 24px; background: #fff;
      display: grid; place-items: center; font-weight: 900; font-size: 26px;
      color: #C8102E; letter-spacing: -1px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    #boot small { color: #9DBBD4; font-size: 11px; letter-spacing: .5px; }
  </style>
</head>
<body>
  <!-- Shown until the Flutter engine takes over. Matches the native splash. -->
  <div id="boot">
    <div class="crest">ALA</div>
    <div style="font-size:16px;text-align:center;line-height:1.4">
      American Lifeguard<br>Association<sup style="font-size:9px">®</sup>
    </div>
    <small>SAFETY · TRAINING · CERTIFICATION</small>
  </div>

  <script>
    // Capture the install prompt so the "Install App" row in More can fire it.
    window.alaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.alaInstallPrompt = e;
      window.dispatchEvent(new Event('ala-installable'));
    });

    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
