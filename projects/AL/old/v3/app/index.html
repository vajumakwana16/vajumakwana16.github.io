<!DOCTYPE html><html lang="en"><head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lifeguard training, certification and water-safety resources from the American Lifeguard Association.">

  <!-- PWA & Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A2540">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <title>American Lifeguard Association</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0A2540; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: linear-gradient(160deg, #0A2540, #155080);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff; z-index: 9999;
    }
    #boot img {
      max-width: 280px;
      max-height: 80px;
      object-fit: contain;
    }
  </style>
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0A2540;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  
  <!-- Shown until the Flutter engine takes over. Matches the native splash. -->
  <div id="boot">
    <img src="assets/assets/images/old/app_logo.jpg" alt="American Lifeguard Association" onerror="if (this.src.indexOf('assets/assets/') != -1) this.src = 'assets/images/old/app_logo.jpg';">
  </div>

  <script>
    // Capture PWA install prompt early
    window.deferredInstallPrompt = null;
    window.isAppInstalled = false;

    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      window.isAppInstalled = true;
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      window.alaInstallPrompt = e;
    });

    window.addEventListener('appinstalled', function () {
      window.deferredInstallPrompt = null;
      window.alaInstallPrompt = null;
      window.isAppInstalled = true;
    });

    function isPwaInstallable() {
      return (window.deferredInstallPrompt !== null && !window.isAppInstalled) === true;
    }

    function isPwaInstalled() {
      return (window.isAppInstalled || window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) === true;
    }

    function promptPwaInstall() {
      var promptEvent = window.deferredInstallPrompt || window.alaInstallPrompt;
      if (promptEvent) {
        try {
          promptEvent.prompt();
          promptEvent.userChoice.then(function (choiceResult) {
            if (choiceResult && choiceResult.outcome === 'accepted') {
              window.isAppInstalled = true;
            }
            window.deferredInstallPrompt = null;
            window.alaInstallPrompt = null;
          });
        } catch (err) {
          console.error("promptPwaInstall error:", err);
        }
        return true;
      }
      return false;
    }

    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
